
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pop Diva Quiz ★</title>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Nunito:wght@500;700;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <script src="code.js" defer></script>
</head>

<body>
  <main class="quiz-box">
    <div class="sparkles">★ ✧ ♡ ✧ ★</div>

    <h1>POP DIVA QUIZ</h1>
    <p class="subtitle">
      ✦ prove que você nasceu para ser uma pop girlie ✦
    </p>

    <section id="game">
      <div class="progress">
        <div id="progress-bar"></div>
      </div>

      <p id="counter">PERGUNTA 1 DE 5</p>
      <div id="question"></div>
      <div id="answers"></div>
      <p id="feedback" aria-live="polite"></p>
      <button id="next" type="button">PRÓXIMA ✧</button>
    </section>

    <section id="result" aria-live="polite">
      <div class="sparkles">💖 ✨ 💿 ✨ 💖</div>
      <h2 id="result-title"></h2>
      <p id="result-text"></p>
      <p id="score"></p>
      <button id="restart" type="button">JOGAR DE NOVO ↻</button>
    </section>

    <div class="footer">
      MADE WITH ♥ AND TOO MUCH GLITTER
    </div>
  </main>
</body>
</html>
